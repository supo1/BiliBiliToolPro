name: BiliBili Daily Tasks

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点 = 北京时间早8点
  workflow_dispatch:

jobs:
  run-daily-tasks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/raywangqvq/bili_tool_web:latest
    env:
      BiliBiliCookies__BiliBiliCookies__0: ${{ secrets.BILIBILI_COOKIES }}
      DOTNET_ENVIRONMENT: Production
    steps:
      - name: Run Daily Task
        run: |
          cd /app
          echo "3" | dotnet Ray.BiliBiliTool.Console.dll
