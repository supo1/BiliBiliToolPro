name: BiliBili Daily Tasks

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点 = 北京时间早8点
  workflow_dispatch:

jobs:
  run-daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download BiliBiliToolPro
        run: |
          curl -L "https://github.com/RayWangQvQ/BiliBiliToolPro/releases/download/3.8.1/bilibili-tool-pro-v3.8.1-dotnet-dependent.zip" -o bilitool.zip
          unzip bilitool.zip -d bilitool

      - name: Setup Cookie
        run: |
          mkdir -p bilitool/dotnet-dependent
          cat > bilitool/dotnet-dependent/cookies.json << EOF
          {
            "BiliBiliCookies": [
              "${{ secrets.BILIBILI_COOKIES }}"
            ]
          }
          EOF

      - name: Run Daily Task
        run: |
          cd bilitool/dotnet-dependent
          chmod +x Ray.BiliBiliTool.Console
          for task in 3 4 5 6 7 8 9 11; do
            echo "$task" | ./Ray.BiliBiliTool.Console
          done
